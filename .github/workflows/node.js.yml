# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          loginpage/package-lock.json

    # Install frontend + backend deps (single workspace under ./loginpage)
    - name: Install Dependencies (loginpage)
      run: npm ci --prefix loginpage


    # Run unit tests (Vitest) in CI mode
    - name: Run Tests (Vitest CI)
      run: npm run test:ci --if-present --prefix loginpage

    # Build frontend with Vite to ensure it is deployable
    - name: Build Frontend with Vite
      run: npm run build --prefix loginpage
